<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="600" fill="#070d1a"/>

  <!-- Left Side Atmospheric Glow Effects -->
  <defs>
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#f97316; stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#f97316; stop-opacity:0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#3b82f6; stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#3b82f6; stop-opacity:0" />
    </radialGradient>
  </defs>
  <ellipse cx="100" cy="300" rx="200" ry="200" fill="url(#orangeGlow)" opacity="0.08"/>
  <ellipse cx="250" cy="150" rx="150" ry="150" fill="url(#blueGlow)" opacity="0.06"/>

  <!-- Floor Plan Schematic -->
  <rect x="500" y="30" width="660" height="560" fill="none" stroke="#1e40af" stroke-width="2.5" rx="4"/>

  <!-- Rooms -->
  <rect x="500" y="30" width="250" height="250" fill="#1e40af" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="750" y="30" width="200" height="250" fill="#1a3a1a" fill-opacity="0.3" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="950" y="30" width="210" height="250" fill="#3b0f0f" fill-opacity="0.35" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="500" y="280" width="200" height="180" fill="#0f172a" fill-opacity="0.4" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="700" y="280" width="250" height="180" fill="#1a0f2e" fill-opacity="0.35" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="950" y="280" width="210" height="310" fill="#1c1c0a" fill-opacity="0.3" stroke="#eab308" stroke-width="1.5"/>
  <rect x="500" y="460" width="450" height="130" fill="#0f1a1f" fill-opacity="0.4" stroke="#06b6d4" stroke-width="1.5"/>

  <!-- Dimension Lines -->
  <line x1="500" y1="595" x2="950" y2="595" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="700" y="22" fill="#93c5fd" font-size="11" text-anchor="middle">9000mm</text>
  <line x1="495" y1="30" x2="495" y2="590" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="490" y="300" fill="#93c5fd" font-size="11" transform="rotate(-90 490 300)" text-anchor="middle">12000mm</text>

  <!-- Tick Marks -->
  <line x1="500" y1="590" x2="500" y2="600" stroke="#93c5fd" stroke-width="1"/>
  <line x1="950" y1="590" x2="950" y2="600" stroke="#93c5fd" stroke-width="1"/>
  <line x1="490" y1="30" x2="500" y2="30" stroke="#93c5fd" stroke-width="1"/>
  <line x1="490" y1="590" x2="500" y2="590" stroke="#93c5fd" stroke-width="1"/>

  <!-- Room Labels -->
  <text x="625" y="155" fill="#64748b" font-size="13" text-anchor="middle">Living</text>
  <text x="850" y="155" fill="#64748b" font-size="13" text-anchor="middle">Bed 1</text>
  <text x="1055" y="155" fill="#64748b" font-size="13" text-anchor="middle">Kitchen</text>
  <text x="600" y="370" fill="#64748b" font-size="13" text-anchor="middle">Dining</text>
  <text x="825" y="370" fill="#64748b" font-size="13" text-anchor="middle">Bed 2</text>
  <text x="1055" y="435" fill="#64748b" font-size="13" text-anchor="middle">Stair</text>
  <text x="725" y="525" fill="#64748b" font-size="13" text-anchor="middle">Parking</text>

  <!-- North Arrow -->
  <polygon points="1130,60 1135,70 1125,70" fill="#f97316"/>
  <text x="1130" y="85" fill="#f97316" font-size="12" text-anchor="middle">N</text>

  <!-- Column Dots -->
  <circle cx="500" cy="30" r="5" fill="#f97316"/>
  <circle cx="1160" cy="30" r="5" fill="#f97316"/>
  <circle cx="500" cy="590" r="5" fill="#f97316"/>
  <circle cx="1160" cy="590" r="5" fill="#f97316"/>
</svg>