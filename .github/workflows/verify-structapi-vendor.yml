name: Verify structapi vendor sync

on:
  push:
    branches: [main]
    paths:
      - "structapi-service/**"
      - ".github/workflows/verify-structapi-vendor.yml"
  pull_request:
    paths:
      - "structapi-service/**"
  schedule:
    # Weekly freshness check (informational — opens an issue, doesn't fail)
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  vendor-sync:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify vendored copy matches the pinned structapi tag
        env:
          GH_TOKEN: ${{ secrets.STRUCTAPI_SYNC_TOKEN }}
        run: bash scripts/verify-structapi-vendor.sh

  vendor-freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # NOTE: a job-level permissions block REPLACES the defaults — without
    # contents: read the GITHUB_TOKEN cannot even check out this repo and
    # actions/checkout dies with a masked-403 "Repository not found".
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Check whether a newer structapi release exists
        env:
          GH_TOKEN: ${{ secrets.STRUCTAPI_SYNC_TOKEN }}
        run: bash scripts/check-structapi-freshness.sh
