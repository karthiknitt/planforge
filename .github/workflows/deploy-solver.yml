name: Deploy Solver to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-solver.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      # Same image as the API service — one Dockerfile, one artifact, two
      # services. Cache is read-only here: this workflow and deploy-backend.yml
      # trigger on the same backend/** paths and therefore run concurrently, so
      # two --cache-to exporters would race on the one :buildcache ref and
      # corrupt what Task B3 added. Reading it still gives full layer reuse and
      # writes nothing extra into Artifact Registry.
      - name: Build and push image
        working-directory: backend
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/planforge-backend/api:${{ github.sha }}"
          CACHE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/planforge-backend/api:buildcache"
          docker buildx build \
            --cache-from "type=registry,ref=$CACHE" \
            --tag "$IMAGE" \
            --push \
            .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: planforge-solver
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          # --concurrency=1 is the whole point: one solve per instance, so a
          # request never queues behind a 40s CP-SAT run on a busy worker.
          # --allow-unauthenticated: Inngest Cloud is an external SaaS with no
          # GCP identity, so it can never satisfy Cloud Run's IAM invoker check
          # (confirmed: --no-allow-unauthenticated returned 403 at the platform
          # layer, before Inngest's own signature check ever ran — every job
          # routed here silently vanished and only surfaced via the 120s
          # queued-job watchdog in jobs.py). Security is enforced the same way
          # planforge-backend already does it: INNGEST_SIGNING_KEY verification
          # inside the Inngest SDK, not Cloud Run IAM.
          flags: >-
            --min-instances=0
            --max-instances=5
            --concurrency=1
            --timeout=600
            --cpu=2
            --memory=2Gi
            --allow-unauthenticated
          # See deploy-backend.yml for the comma-escaping caveat on
          # BACKEND_ALLOWED_ORIGINS.
          env_vars: |
            DATABASE_URL=${{ secrets.NEON_DATABASE_URL }}
            DB_USE_NULLPOOL=true
            ALLOWED_ORIGINS=${{ secrets.BACKEND_ALLOWED_ORIGINS }}
            INTERNAL_AUTH_SECRET=${{ secrets.INTERNAL_AUTH_SECRET }}
            RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
            RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
            RENDER_PROVIDER=openrouter
            RENDER_MODEL=openai/gpt-image-1
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            INNGEST_EVENT_KEY=${{ secrets.INNGEST_EVENT_KEY }}
            INNGEST_SIGNING_KEY=${{ secrets.INNGEST_SIGNING_KEY }}
            INNGEST_APP_ID=planforge-solver
            STRUCTURAL_API_URL=${{ secrets.STRUCTURAL_API_URL }}
            STRUCTURAL_API_KEY=${{ secrets.STRUCTURAL_API_KEY }}
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET=${{ secrets.R2_BUCKET }}

      - name: Print service URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
