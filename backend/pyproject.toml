[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "boto3>=1.43.56",
    "ezdxf>=1.4.3",
    "fastapi>=0.129.0",
    "httpx>=0.28",
    "inngest>=0.5.19",
    "openpyxl>=3.1.5",
    "ortools>=9.15.6755",
    "pydantic-settings>=2.13.0",
    "pyjwt>=2.13.0",
    "pymupdf>=1.27",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.32",
    "razorpay>=2.0.0",
    "reportlab>=4.4.10",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.46",
    "uvicorn[standard]>=0.41.0",
]

[project.optional-dependencies]
ifc-experiment = [
    "ifcopenshell>=0.8.0",
    "numpy>=1.26",
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pymupdf>=1.27.2.3",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.9",
]

[tool.ruff.lint]
# Explicit pin of ruff's pre-0.16 default rule set. Ruff 0.16 broadened its
# implicit defaults (bugbear, isort, bandit, pyupgrade, pylint, refurb, perf,
# simplify, ...); without this the same `ruff check` with no config change
# newly flags 300+ pre-existing lines untouched by this dependency bump.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: full-pipeline tests that run a real CP-SAT solve (or DXF/PDF/BOQ/structural rendering downstream of one); >=24s each in isolation on this hardware. Excluded by the dev fast path: `pytest -m 'not slow'`.",
]
# Per-test hang guard, not a perf budget: CP-SAT can hang, and this must fail
# loudly instead of silently eating a 76-minute run. 300s is well above any
# single test observed (slowest *file*, summing multiple tests, was 362s) but
# short enough that a real hang doesn't stall CI for long.
timeout = 300
